<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ERP Pro V18 - Completo</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet" />

    <style>
        /* --- ESTILOS GERAIS --- */
        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --bg-app: #f1f5f9;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text-main: #334155;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
            --whatsapp: #25D366;
        }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; outline: none; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg-app); color: var(--text-main); padding-bottom: 90px; }

        /* TOAST */
        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 13000; }
        .toast { background: #333; color: #fff; padding: 12px 24px; border-radius: 8px; margin-bottom: 10px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); animation: slideIn 0.3s; display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }

        /* LOGIN & MODALS */
        #auth-overlay { position: fixed; inset: 0; z-index: 12000; background: var(--primary); display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { background: var(--surface); width: 100%; max-width: 360px; padding: 40px; border-radius: 20px; text-align: center; }
        .pin-display { font-size: 32px; letter-spacing: 12px; font-weight: 800; border: 2px solid var(--border); border-radius: 12px; padding: 10px; width: 100%; text-align: center; margin: 25px 0; color: var(--primary); }
        .btn-auth { width: 100%; padding: 16px; background: var(--primary); color: #fff; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; }
        .input-std { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 15px; }

        /* NAVEGAÇÃO */
        nav { position: fixed; bottom: 0; width: 100%; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-top: 1px solid var(--border); z-index: 1000; }
        nav div { padding: 12px 0; text-align: center; color: #94a3b8; cursor: pointer; font-size: 10px; font-weight: 700; text-transform: uppercase; }
        nav div i { font-size: 18px; display: block; margin-bottom: 4px; }
        nav div.active { color: var(--accent); border-top: 3px solid var(--accent); }

        /* CONTEÚDO */
        main { padding: 20px; max-width: 800px; margin: 0 auto; display: none; }
        .card { background: var(--surface); padding: 20px; border-radius: 16px; border: 1px solid var(--border); margin-bottom: 15px; }
        .section-header { font-size: 18px; font-weight: 800; margin-bottom: 15px; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        
        input, select, textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 10px; }
        .btn { padding: 14px; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 5px; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-success { background: var(--success); color: #fff; }
        
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #f8fafc; border-radius: 10px; margin-bottom: 8px; }
        .btn-icon { border: none; padding: 8px; border-radius: 6px; cursor: pointer; }
        .btn-delete { background: #fee2e2; color: var(--danger); }

        /* PREVIEW PDF */
        #preview { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; flex-direction: column; z-index: 14000; }
        #pdf-box { background: white; width: 90%; max-width: 800px; margin: 20px auto; padding: 40px; color: #000; }
        
        /* ESTILOS INTERNOS DO PDF */
        .p-header { border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; }
        .p-table { width: 100%; border-collapse: collapse; }
        .p-table th { background: #f1f5f9; text-align: left; padding: 8px; border: 1px solid #ddd; }
        .p-table td { padding: 8px; border: 1px solid #ddd; }
    </style>
</head>
<body>

<div id="toast-container"></div>

<div id="auth-overlay">
    <div id="view-master" class="auth-card">
        <h2>Acesso Mestre</h2>
        <input id="master-pass" type="password" class="input-std" placeholder="Senha Mestra" />
        <button class="btn-auth" onclick="auth.checkMaster()">DESBLOQUEAR</button>
    </div>

    <div id="view-setup" class="auth-card" style="display:none">
        <h2>Criar PIN</h2>
        <input id="setup-pin" type="tel" maxlength="4" class="input-std" placeholder="PIN (4 dígitos)" />
        <input id="setup-secret" type="text" class="input-std" placeholder="Palavra de Recuperação" />
        <button class="btn-auth" onclick="auth.setup()">SALVAR</button>
    </div>

    <div id="view-login" class="auth-card" style="display:none">
        <h2>Entrar</h2>
        <input id="login-pin" type="tel" maxlength="4" class="pin-display" placeholder="••••" onkeyup="if(this.value.length==4) auth.login()" />
        <button class="btn-auth" onclick="auth.login()">ACESSAR</button>
    </div>
</div>

<nav id="nav-bar" style="display:none">
    <div onclick="ui.tab('v', this)" class="active"><i class="fas fa-calculator"></i>Orçamento</div>
    <div onclick="ui.tab('c', this)"><i class="fas fa-users"></i>Clientes</div>
    <div onclick="ui.tab('i', this)"><i class="fas fa-box"></i>Catálogo</div>
    <div onclick="ui.tab('r', this)"><i class="fas fa-file-alt"></i>Laudo</div>
</nav>

<main id="app-container">
    <section id="v">
        <div class="card">
            <div class="section-header"><i class="fas fa-file-invoice"></i> Novo Orçamento</div>
            <select id="v-cli-select"><option>Carregando clientes...</option></select>
            <hr>
            <label>Adicionar Item:</label>
            <select id="v-saved-items" onchange="app.fillItemFields()"><option value="">📂 Buscar do catálogo...</option></select>
            <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 10px;">
                <input id="v-n" placeholder="Nome do produto/serviço">
                <input id="v-q" type="number" placeholder="Qtd" value="1">
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <input id="v-p" type="number" placeholder="Preço Unitário">
                <input id="v-u" placeholder="Unidade (ex: Un, m²)">
            </div>
            <button class="btn btn-primary" onclick="app.addItem()"><i class="fas fa-plus"></i> Adicionar Item</button>
        </div>
        <div class="card">
            <div id="cart-list"></div>
            <div style="font-size: 20px; font-weight: 800; text-align: right; margin: 15px 0;" id="saldo-box">R$ 0,00</div>
            <button class="btn btn-success" id="btn-gerar" style="display:none" onclick="app.generateBudget()">GERAR PDF</button>
        </div>
    </section>

    <section id="c" style="display:none">
        <div class="card">
            <div class="section-header">Cadastrar Cliente</div>
            <input id="c-nome" placeholder="Nome Completo">
            <input id="c-tel" placeholder="Telefone">
            <input id="c-end" placeholder="Endereço">
            <button class="btn btn-primary" onclick="app.saveClient()">SALVAR CLIENTE</button>
        </div>
        <div id="c-list"></div>
    </section>

    <section id="i" style="display:none">
        <div class="card">
            <div class="section-header">Novo Item no Catálogo</div>
            <input id="i-nome" placeholder="Nome do Item">
            <input id="i-preco" type="number" placeholder="Preço Padrão">
            <input id="i-un" placeholder="Unidade (ex: Un)">
            <button class="btn btn-primary" onclick="app.saveItem()">SALVAR NO CATÁLOGO</button>
        </div>
        <div id="i-list"></div>
    </section>

    <section id="r" style="display:none">
        <div class="card">
            <div class="section-header">Laudo Técnico</div>
            <select id="r-cli-select"></select>
            <textarea id="r-text" rows="5" placeholder="Descreva o parecer técnico..."></textarea>
            <input type="file" id="r-imgs" multiple onchange="laudo.handleImages(event)">
            <div id="r-preview-imgs" style="display:flex; gap:10px; margin-top:10px"></div>
            <button class="btn btn-primary" onclick="laudo.generate()">GERAR LAUDO PDF</button>
        </div>
    </section>
</main>

<div id="preview">
    <div style="padding:10px; background:white; display:flex; gap:10px; justify-content: center;">
        <button class="btn btn-primary" style="width:auto" onclick="app.download()">BAIXAR PDF</button>
        <button class="btn" style="width:auto; background:#ddd" onclick="ui.close()">FECHAR</button>
    </div>
    <div style="overflow-y: auto;"><div id="pdf-box"></div></div>
</div>

<script>
const BRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });

const ui = {
    toast(msg, type = 'success') {
        const div = document.createElement('div');
        div.className = `toast ${type}`;
        div.innerText = msg;
        document.getElementById('toast-container').appendChild(div);
        setTimeout(() => div.remove(), 3000);
    },
    tab(id, el) {
        document.querySelectorAll("section").forEach(s => s.style.display = "none");
        document.getElementById(id).style.display = "block";
        document.querySelectorAll("nav div").forEach(d => d.classList.remove("active"));
        el.classList.add("active");
        app.load();
    },
    close() { document.getElementById("preview").style.display = "none"; }
};

const auth = {
    MASTER_KEY: '91538300AA',
    hash: s => s.split('').reduce((a, b) => { a = ((a << 5) - a) + b.charCodeAt(0); return a & a; }, 0).toString(),
    init() {
        if(localStorage.getItem("erp_auth")) this.switch('login');
    },
    switch(v) {
        ['master','setup','login'].forEach(i => document.getElementById('view-'+i).style.display='none');
        document.getElementById('view-'+v).style.display='block';
    },
    checkMaster() {
        if(document.getElementById('master-pass').value === this.MASTER_KEY) this.switch('setup');
        else ui.toast('Chave incorreta', 'error');
    },
    setup() {
        const p = document.getElementById('setup-pin').value;
        if(p.length !== 4) return ui.toast('PIN deve ter 4 dígitos');
        localStorage.setItem("erp_auth", this.hash(p));
        this.enter();
    },
    login() {
        const p = document.getElementById('login-pin').value;
        if(this.hash(p) === localStorage.getItem("erp_auth")) this.enter();
        else { ui.toast('PIN Inválido', 'error'); document.getElementById('login-pin').value = ''; }
    },
    enter() {
        document.getElementById('auth-overlay').style.display = 'none';
        document.getElementById('nav-bar').style.display = 'grid';
        document.getElementById('app-container').style.display = 'block';
        app.initDB();
    }
};

let db;
const app = {
    cart: [],
    initDB() {
        const req = indexedDB.open("ERP_V18", 1);
        req.onupgradeneeded = e => {
            const d = e.target.result;
            d.createObjectStore("clients", {keyPath: "id", autoIncrement: true});
            d.createObjectStore("items", {keyPath: "id", autoIncrement: true});
        };
        req.onsuccess = e => { db = e.target.result; this.load(); };
    },
    load() {
        const tx = db.transaction(["clients", "items"], "readonly");
        tx.objectStore("clients").getAll().onsuccess = e => {
            const cls = e.target.result;
            const html = cls.map(c => `<div class="list-item"><span>${c.nome}</span><button class="btn-icon btn-delete" onclick="app.delete('clients', ${c.id})"><i class="fas fa-trash"></i></button></div>`).join('');
            document.getElementById('c-list').innerHTML = html;
            const selectHtml = '<option value="">-- Selecione o Cliente --</option>' + cls.map(c => `<option value="${c.id}">${c.nome}</option>`).join('');
            document.getElementById('v-cli-select').innerHTML = selectHtml;
            document.getElementById('r-cli-select').innerHTML = selectHtml;
        };
        tx.objectStore("items").getAll().onsuccess = e => {
            const its = e.target.result;
            this.catalogItems = its;
            document.getElementById('i-list').innerHTML = its.map(i => `<div class="list-item"><span>${i.nome} - ${BRL.format(i.preco)}</span><button class="btn-icon btn-delete" onclick="app.delete('items', ${i.id})"><i class="fas fa-trash"></i></button></div>`).join('');
            document.getElementById('v-saved-items').innerHTML = '<option value="">📂 Buscar do catálogo...</option>' + its.map((i, idx) => `<option value="${idx}">${i.nome}</option>`).join('');
        };
    },
    saveClient() {
        const nome = document.getElementById('c-nome').value;
        if(!nome) return;
        db.transaction("clients", "readwrite").objectStore("clients").add({nome, tel: document.getElementById('c-tel').value, end: document.getElementById('c-end').value}).onsuccess = () => { ui.toast("Salvo!"); this.load(); };
    },
    saveItem() {
        const nome = document.getElementById('i-nome').value;
        const preco = parseFloat(document.getElementById('i-preco').value);
        if(!nome || !preco) return;
        db.transaction("items", "readwrite").objectStore("items").add({nome, preco, un: document.getElementById('i-un').value}).onsuccess = () => { ui.toast("Item salvo!"); this.load(); };
    },
    delete(store, id) {
        if(confirm("Excluir item?")) db.transaction(store, "readwrite").objectStore(store).delete(id).onsuccess = () => this.load();
    },
    fillItemFields() {
        const idx = document.getElementById('v-saved-items').value;
        if(idx === "") return;
        const item = this.catalogItems[idx];
        document.getElementById('v-n').value = item.nome;
        document.getElementById('v-p').value = item.preco;
        document.getElementById('v-u').value = item.un;
    },
    addItem() {
        const n = document.getElementById('v-n').value;
        const p = parseFloat(document.getElementById('v-p').value);
        const q = parseFloat(document.getElementById('v-q').value);
        const u = document.getElementById('v-u').value;
        if(!n || isNaN(p)) return ui.toast("Preencha o item corretamente", "error");
        this.cart.push({n, p, q, u});
        this.renderCart();
    },
    renderCart() {
        const total = this.cart.reduce((a, b) => a + (b.p * b.q), 0);
        document.getElementById('cart-list').innerHTML = this.cart.map((i, idx) => `
            <div class="list-item">
                <div><b>${i.n}</b><br><small>${i.q} ${i.u} x ${BRL.format(i.p)}</small></div>
                <div style="text-align:right"><b>${BRL.format(i.p*i.q)}</b><br><span style="color:red; cursor:pointer" onclick="app.cart.splice(${idx},1); app.renderCart()">Remover</span></div>
            </div>`).join('');
        document.getElementById('saldo-box').innerText = BRL.format(total);
        document.getElementById('btn-gerar').style.display = this.cart.length ? 'block' : 'none';
    },
    generateBudget() {
        const cliId = document.getElementById('v-cli-select').value;
        if(!cliId) return ui.toast("Selecione um cliente", "error");
        
        let html = `<div class="p-header"><h2>ORÇAMENTO</h2><div>Data: ${new Date().toLocaleDateString()}</div></div>`;
        html += `<table class="p-table"><thead><tr><th>Item</th><th>Qtd</th><th>Total</th></tr></thead><tbody>`;
        this.cart.forEach(i => {
            html += `<tr><td>${i.n}</td><td>${i.q} ${i.u}</td><td>${BRL.format(i.p*i.q)}</td></tr>`;
        });
        html += `</tbody></table><h3 style="text-align:right">Total: ${document.getElementById('saldo-box').innerText}</h3>`;
        
        document.getElementById('pdf-box').innerHTML = html;
        document.getElementById('preview').style.display = 'flex';
    },
    download() {
        const opt = { margin: 10, filename: 'documento.pdf', html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } };
        html2pdf().set(opt).from(document.getElementById('pdf-box')).save();
    }
};

const laudo = {
    images: [],
    handleImages(e) {
        this.images = [];
        const files = Array.from(e.target.files);
        files.forEach(f => {
            const r = new FileReader();
            r.onload = ev => this.images.push(ev.target.result);
            r.readAsDataURL(f);
        });
    },
    generate() {
        const txt = document.getElementById('r-text').value;
        let html = `<h2>LAUDO TÉCNICO</h2><p style="white-space:pre-wrap">${txt}</p>`;
        html += `<div style="display:grid; grid-template-columns:1fr 1fr; gap:10px">`;
        this.images.forEach(img => html += `<img src="${img}" style="width:100%">`);
        html += `</div>`;
        document.getElementById('pdf-box').innerHTML = html;
        document.getElementById('preview').style.display = 'flex';
    }
};

window.onload = () => auth.init();
</script>

</body>
</html>
